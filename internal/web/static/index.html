<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CageHarness — AI4SE Coding Agent Harness</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --text: #c9d1d9;
    --dim: #6e7681;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d2991d;
    --purple: #a371f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    min-height: 100vh;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 24px; }
  header {
    padding: 24px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px;
  }
  header h1 { font-size: 1.5rem; color: var(--accent); }
  header p { color: var(--dim); font-size: 0.9rem; margin-top: 4px; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 20px; margin-bottom: 16px;
  }
  .card h2 { font-size: 1.1rem; margin-bottom: 12px; color: var(--accent); }

  form { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 12px; color: var(--text);
    font-size: 0.95rem;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: none;
    border-radius: 6px; padding: 10px 20px; cursor: pointer;
    font-size: 0.95rem; font-weight: 500; transition: opacity 0.2s;
  }
  button:hover { opacity: 0.85; }
  button.danger { background: var(--red); }
  button.small { padding: 4px 12px; font-size: 0.8rem; }

  .task-list { list-style: none; }
  .task-item {
    display: flex; align-items: center; gap: 12px; padding: 12px;
    border-bottom: 1px solid var(--border);
  }
  .task-item:last-child { border-bottom: none; }
  .task-id {
    font-family: 'SF Mono', 'Cascadia Code', monospace;
    font-size: 0.85rem; color: var(--dim); min-width: 70px;
  }
  .task-cmd { flex: 1; font-size: 0.9rem; }
  .task-status {
    font-size: 0.8rem; font-weight: 600; padding: 2px 10px;
    border-radius: 12px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .status-pending { background: rgba(110,118,129,0.2); color: var(--dim); }
  .status-running { background: rgba(88,166,255,0.15); color: var(--accent); }
  .status-completed { background: rgba(63,185,80,0.15); color: var(--green); }
  .status-failed { background: rgba(248,81,73,0.15); color: var(--red); }
  .status-cancelled { background: rgba(210,153,29,0.15); color: var(--yellow); }

  .task-result {
    font-size: 0.85rem; color: var(--dim); margin-top: 4px;
    padding: 8px; background: var(--bg); border-radius: 4px;
    white-space: pre-wrap; word-break: break-word; max-height: 120px; overflow-y: auto;
  }
  .task-error { color: var(--red); }

  .empty { text-align: center; color: var(--dim); padding: 32px 0; }
  .badge {
    display: inline-block; font-size: 0.7rem; font-weight: 600;
    padding: 2px 8px; border-radius: 10px; margin-left: 8px;
  }
  .badge-governance { background: rgba(163,113,247,0.15); color: var(--purple); }

  .footer { text-align: center; color: var(--dim); font-size: 0.8rem; padding: 24px 0; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🛡️ CageHarness</h1>
    <p>AI4SE Coding Agent Harness — Governance-driven, zero-dependency, TDD-built</p>
  </header>

  <div class="card">
    <h2>Submit Task</h2>
    <form id="task-form">
      <input type="text" id="task-input" placeholder="e.g., Write a hello world program in Go" autofocus>
      <button type="submit">Run</button>
    </form>
  </div>

  <div class="card">
    <h2>Tasks <span class="badge badge-governance">Governance ★</span></h2>
    <ul class="task-list" id="task-list">
      <li class="empty">No tasks yet. Submit a task above to get started.</li>
    </ul>
  </div>

  <div class="footer">
    CageHarness · Agent = LLM + Harness · Governance Pipeline: Schema → Risk → Policy → Boundary → Control
  </div>
</div>

<script>
const API = '/tasks';
let refreshTimer = null;

document.getElementById('task-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('task-input');
  const task = input.value.trim();
  if (!task) return;

  try {
    const resp = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task })
    });
    if (!resp.ok) {
      const err = await resp.json();
      alert('Error: ' + (err.error || resp.statusText));
      return;
    }
    const data = await resp.json();
    input.value = '';
    fetchTasks();
    console.log('Task submitted:', data.task_id);
  } catch (err) {
    alert('Network error: ' + err.message);
  }
});

async function fetchTasks() {
  try {
    const resp = await fetch(API);
    if (!resp.ok) return;
    const tasks = await resp.json();
    renderTasks(tasks);
  } catch (err) {
    console.error('fetchTasks:', err);
  }
}

function statusClass(status) {
  return 'status-' + (status || 'pending');
}

function renderTasks(tasks) {
  const list = document.getElementById('task-list');
  if (!tasks || tasks.length === 0) {
    list.innerHTML = '<li class="empty">No tasks yet. Submit a task above to get started.</li>';
    return;
  }

  list.innerHTML = tasks.map(t => `
    <li>
      <div class="task-item">
        <span class="task-id">${esc(t.id)}</span>
        <span class="task-cmd">${esc(t.task)}</span>
        <span class="task-status ${statusClass(t.status)}">${esc(t.status)}</span>
        ${t.status === 'completed' || t.status === 'failed' || t.status === 'cancelled' ? '' :
          `<button class="small danger" onclick="cancelTask('${esc(t.id)}')">Cancel</button>`}
      </div>
      ${t.result ? `<div class="task-result">${esc(t.result)}</div>` : ''}
      ${t.error ? `<div class="task-result task-error">${esc(t.error)}</div>` : ''}
    </li>
  `).join('');

  // Auto-refresh if any task is still running
  const hasRunning = tasks.some(t => t.status === 'pending' || t.status === 'running');
  if (hasRunning && !refreshTimer) {
    refreshTimer = setInterval(fetchTasks, 2000);
  } else if (!hasRunning && refreshTimer) {
    clearInterval(refreshTimer);
    refreshTimer = null;
  }
}

async function cancelTask(id) {
  try {
    const resp = await fetch(API + '/' + id, { method: 'DELETE' });
    if (!resp.ok) {
      const err = await resp.json();
      alert('Error: ' + (err.error || resp.statusText));
      return;
    }
    fetchTasks();
  } catch (err) {
    alert('Network error: ' + err.message);
  }
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Initial fetch + periodic refresh
fetchTasks();
refreshTimer = setInterval(fetchTasks, 5000);
</script>
</body>
</html>
