name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 与 .gitlab-ci.yml 中同名，保证"CI 配置含 unit-test job"的要求在两个平台一致
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: go vet
        run: go vet ./...

      - name: Unit tests (mock LLM, deterministic)
        run: go test ./internal/... -count=1 -cover

      - name: Demo tests (mechanism demonstration)
        run: go test ./tests/demo/ -v -count=1
